name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        working-directory: mobile/android
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      - name: List APK outputs
        if: success()
        run: find mobile/android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Mobile-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: SentinelAI Mobile Android APK (Latest)
          body: "Official SentinelAI Android Mobile Gateway APK. Download and install on your phone for real-time SMS & Notification threat scanning."
          files: mobile/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
