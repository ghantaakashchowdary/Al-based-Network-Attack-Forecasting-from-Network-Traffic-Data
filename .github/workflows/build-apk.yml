name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: mobile/android
        shell: bash {0}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1
          EXIT_CODE=$?
          echo "Gradle exit code: $EXIT_CODE"
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f
          if find . -name "*.apk" -type f | grep -q ".apk"; then
            echo "APK found! Proceeding."
            exit 0
          else
            echo "No APK produced."
            exit $EXIT_CODE
          fi

      - name: Package APK
        run: |
          APK_PATH=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "APK at: $APK_PATH"
          mkdir -p apk-output
          cp "$APK_PATH" apk-output/SentinelAI-Mobile.apk
          ls -lh apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Mobile-APK
          path: apk-output/SentinelAI-Mobile.apk

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: SentinelAI Mobile Android APK (Latest)
          body: "Official SentinelAI Android Mobile Gateway APK. Download and install on your phone for real-time SMS & Notification threat scanning."
          files: apk-output/SentinelAI-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
