name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: mobile/android
        shell: bash {0}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          find . -name "*.apk" -type f | tee -a /tmp/build.log
          APK_COUNT=$(find . -name "*.apk" -type f | wc -l)
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "APK_FOUND=true" >> $GITHUB_ENV
            exit 0
          else
            echo "APK_FOUND=false" >> $GITHUB_ENV
            echo "=== ERRORS ===" >> /tmp/build.log
            grep -i "error\|FAILED\|Exception\|cannot find" /tmp/build.log | tail -30 >> /tmp/build-errors.log 2>/dev/null || true
            exit $EXIT_CODE
          fi

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build*.log
          if-no-files-found: ignore

      - name: Package APK
        if: env.APK_FOUND == 'true'
        run: |
          APK_PATH=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "APK at: $APK_PATH"
          mkdir -p apk-output
          cp "$APK_PATH" apk-output/SentinelAI-Mobile.apk
          ls -lh apk-output/

      - name: Upload APK Artifact
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Mobile-APK
          path: apk-output/SentinelAI-Mobile.apk

      - name: Create GitHub Release with APK
        if: env.APK_FOUND == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: SentinelAI Mobile Android APK (Latest)
          body: "Official SentinelAI Android Mobile Gateway APK. Download and install on your phone."
          files: apk-output/SentinelAI-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
