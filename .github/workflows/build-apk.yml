name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK
        run: |
          APK_PATH=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "APK found at: $APK_PATH"
          mkdir -p apk-output
          cp "$APK_PATH" apk-output/SentinelAI-Mobile.apk
          ls -lh apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Mobile-APK
          path: apk-output/SentinelAI-Mobile.apk

      - name: Create Public GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: SentinelAI Mobile Gateway v1.0.0
          body: "Official SentinelAI Android Mobile Gateway APK. Public 1-tap download for any Android phone."
          files: apk-output/SentinelAI-Mobile.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
